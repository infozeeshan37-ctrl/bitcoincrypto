name: 🎬 Autonomous 3x Daily YouTube Shorts Publisher

on:
  schedule:
    # Runs 3x Daily at peak global engagement times:
    # 1) 12:00 UTC (8:00 AM EST)  -> Slot 1: Next 24h AI Price Prediction
    # 2) 16:00 UTC (12:00 PM EST) -> Slot 2: CoinGlass Liquidation Squeeze Alert
    # 3) 21:00 UTC (5:00 PM EST)  -> Slot 3: Crypto Learn 100-Lesson Masterclass
    - cron: '0 12,16,21 * * *'
  # Allows 1-click manual trigger anytime from GitHub Actions tab
  workflow_dispatch:

jobs:
  publish-short:
    name: 🚀 Synthesize & Upload YouTube Short
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🐍 Setup Python & Install Edge-TTS
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install edge-tts

      - name: 🎥 Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg chromium-browser

      - name: 📦 Install Project Dependencies
        run: npm ci --omit=dev

      - name: 🎬 Generate Video (Voice + UI Screen) & Upload Directly to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: node scripts/autoPostDailyShort.mjs
