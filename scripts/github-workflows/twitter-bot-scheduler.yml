name: 🤖 BitcoinCrypto Twitter Auto-Publisher

on:
  schedule:
    # Runs every 4 hours (at 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    - cron: '0 */4 * * *'
  # Allows manual triggering from the GitHub Actions tab anytime
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in DRY_RUN mode (simulate without publishing)'
        required: false
        default: false
        type: boolean

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci --omit=dev

      - name: 🐦 Execute Auto-Publisher Script
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: node scripts/twitterAutoPublisher.mjs
