    <line x1="780" y1="300" x2="880" y2="250"/>
    <line x1="780" y1="300" x2="880" y2="350"/>
    <line x1="880" y1="150" x2="980" y2="220"/>
    <line x1="880" y1="250" x2="980" y2="220"/>
    <line x1="880" y1="350" x2="980" y2="220"/>
    <line x1="980" y1="220" x2="1080" y2="260"/>
