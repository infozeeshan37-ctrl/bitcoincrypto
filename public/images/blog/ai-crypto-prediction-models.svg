  <circle cx="880" cy="150" r="12" fill="#EC4899"/>
  <circle cx="880" cy="250" r="12" fill="#EC4899"/>
  <circle cx="880" cy="350" r="12" fill="#EC4899"/>
  <circle cx="980" cy="220" r="14" fill="#A855F7"/>
